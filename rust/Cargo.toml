[package]
name = "thunderstrike"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Client for the thunderstrike key-value database: pooled, pipelined, TLS 1.3"
repository = "https://github.com/TheManhattanProject/thunderstrike-client"
license-file = "LICENSE"
readme = "README.md"
keywords = ["thunderstrike", "database", "key-value", "client"]
categories = ["database", "api-bindings"]
links = "thunderstrike_client"
build = "build.rs"
# Exactly what ships: the bindings, the build script, the pinned checksums.
include = [
    "Cargo.toml",
    "build.rs",
    "checksums.txt",
    "src/**/*.rs",
    "examples/**/*.rs",
    "tests/**/*.rs",
    "README.md",
    "LICENSE",
]

# Standalone: not a member of any enclosing workspace.
[workspace]

[dependencies]

[build-dependencies]

[package.metadata.docs.rs]
# docs.rs has no network; build.rs skips the download there.
targets = ["x86_64-unknown-linux-gnu"]
