# Publish a release to the package registries.
#
# Runs when a release is published here. Every package was already built,
# tested and attached to the release by the build that produced it; this
# job only moves the attached files to their registries, so what a
# registry serves is byte-for-byte what the release lists in SHA256SUMS.
#
# No registry key is stored: PyPI, npm, crates.io and NuGet each trust this
# workflow directly (trusted publishing, OIDC). Each registry is set up once
# to trust TheManhattanProject/thunderstrike-client, workflow publish.yml.
# A registry that is not set up fails its own job and no other.
#
# Re-run for an existing release: Actions -> publish -> Run workflow.

name: publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
 Platform packages first:tag:
 Platform packages first:  description: "Release tag to publish (e.g. v0.1.0)"
 Platform packages first:  required: true

permissions:
  contents: read

env:
  TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}

jobs:
  assets:
    name: fetch and verify the release assets
    runs-on: ubuntu-latest
    steps:
 Platform packages first:- name: Download
 Platform packages first:  env:
 Platform packages first:    GH_TOKEN: ${{ github.token }}
 Platform packages first:  run: |
 Platform packages first:    mkdir assets && cd assets
 Platform packages first:    gh release download "$TAG" -R "$GITHUB_REPOSITORY"
 Platform packages first:    sha256sum -c SHA256SUMS
 Platform packages first:- uses: actions/upload-artifact@v4
 Platform packages first:  with:
 Platform packages first:    name: assets
 Platform packages first:    path: assets/
 Platform packages first:    retention-days: 7

  pypi:
    needs: assets
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
 Platform packages first:id-token: write
    steps:
 Platform packages first:- uses: actions/download-artifact@v4
 Platform packages first:  with:
 Platform packages first:    name: assets
 Platform packages first:    path: assets
 Platform packages first:- run: mkdir dist && cp assets/*.whl dist/
 Platform packages first:- uses: pypa/gh-action-pypi-publish@release/v1
 Platform packages first:  with:
 Platform packages first:    packages-dir: dist/

  npm:
    needs: assets
    runs-on: ubuntu-latest
    environment: npm
    permissions:
 Platform packages first:id-token: write
    steps:
 Platform packages first:- uses: actions/download-artifact@v4
 Platform packages first:  with:
 Platform packages first:    name: assets
 Platform packages first:    path: assets
 Platform packages first:- uses: actions/setup-node@v4
 Platform packages first:  with:
 Platform packages first:    node-version: "24"
 Platform packages first:    registry-url: "https://registry.npmjs.org"
 Platform packages first:# Platform packages first: the main package names them as
 Platform packages first:# optionalDependencies, and an install that resolves the main one
 Platform packages first:# before they exist gets no native addon.
 Platform packages first:- name: Publish
 Platform packages first:  run: |
 Platform packages first:    npm install -g npm@latest
 Platform packages first:    for t in assets/thunderstrike-*-*.tgz; do
 Platform packages first:      npm publish "./$t" --access public --provenance
 Platform packages first:    done
 Platform packages first:    npm publish ./assets/thunderstrike-[0-9]*.tgz --access public --provenance

  crates:
    needs: assets
    runs-on: ubuntu-latest
    environment: crates
    permissions:
 Platform packages first:id-token: write
    steps:
 Platform packages first:- uses: actions/checkout@v4
 Platform packages first:  with:
 Platform packages first:    ref: ${{ env.TAG }}
 Platform packages first:- uses: dtolnay/rust-toolchain@stable
 Platform packages first:- uses: rust-lang/crates-io-auth-action@v1
 Platform packages first:  id: auth
 Platform packages first:# The crate's build script downloads this release's bundle and checks
 Platform packages first:# it against checksums.txt, so `cargo publish`'s verify build is a
 Platform packages first:# real end-to-end check of the published crate.
 Platform packages first:- name: Publish
 Platform packages first:  working-directory: rust
 Platform packages first:  env:
 Platform packages first:    CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
 Platform packages first:  run: cargo publish

  nuget:
    needs: assets
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
 Platform packages first:id-token: write
    steps:
 Platform packages first:- uses: actions/download-artifact@v4
 Platform packages first:  with:
 Platform packages first:    name: assets
 Platform packages first:    path: assets
 Platform packages first:- uses: actions/setup-dotnet@v4
 Platform packages first:  with:
 Platform packages first:    dotnet-version: "9.0.x"
 Platform packages first:- uses: NuGet/login@v1
 Platform packages first:  id: login
 Platform packages first:  with:
 Platform packages first:    user: ${{ vars.NUGET_USER }}
 Platform packages first:- name: Publish
 Platform packages first:  run: |
 Platform packages first:    dotnet nuget push assets/*.nupkg \
 Platform packages first:      --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
 Platform packages first:      --source https://api.nuget.org/v3/index.json
