# Publish a release to the package registries.
#
# Runs when a release is published here. Every package was already built,
# tested and attached to the release by the build that produced it; this
# job only moves the attached files to their registries, so what a
# registry serves is byte-for-byte what the release lists in SHA256SUMS.
#
# No registry key is stored: PyPI, npm, crates.io and NuGet each trust this
# workflow directly (trusted publishing, OIDC). Each registry is set up once
# to trust TheManhattanProject/thunderstrike-client, workflow publish.yml.
# A registry that is not set up fails its own job and no other.
#
# Re-run for an existing release: Actions -> publish -> Run workflow.

name: publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.1.0)"
        required: true

permissions:
  contents: read

env:
  TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}

jobs:
  assets:
    name: fetch and verify the release assets
    runs-on: ubuntu-latest
    steps:
      - name: Download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir assets && cd assets
          gh release download "$TAG" -R "$GITHUB_REPOSITORY"
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: assets
          path: assets/
          retention-days: 7

  pypi:
    needs: assets
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: assets
          path: assets
      - run: mkdir dist && cp assets/*.whl dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  npm:
    needs: assets
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: assets
          path: assets
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      # Platform packages first: the main package names them as
      # optionalDependencies, and an install that resolves the main one
      # before they exist gets no native addon.
      - name: Publish
        run: |
          npm install -g npm@latest
          for t in assets/thunderstrike-*-*.tgz; do
            npm publish "$t" --access public --provenance
          done
          npm publish assets/thunderstrike-[0-9]*.tgz --access public --provenance

  crates:
    needs: assets
    runs-on: ubuntu-latest
    environment: crates
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      # The crate's build script downloads this release's bundle and checks
      # it against checksums.txt, so `cargo publish`'s verify build is a
      # real end-to-end check of the published crate.
      - name: Publish
        working-directory: rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish

  nuget:
    needs: assets
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: assets
          path: assets
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish
        run: |
          dotnet nuget push assets/*.nupkg \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json
