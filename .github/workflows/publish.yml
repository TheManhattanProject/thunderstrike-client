# Publish a release to the package registries.
#
# Runs when a release is published here. Every package was already built,
# tested and attached to the release by the build that produced it; this
# job only moves the attached files to their registries, so what a
# registry serves is byte-for-byte what the release lists in SHA256SUMS.
#
# No registry key is stored: PyPI, npm, crates.io and NuGet each trust this
# workflow directly (trusted publishing, OIDC). Each registry is set up once
# to trust TheManhattanProject/thunderstrike-client, workflow publish.yml.
# A registry that is not set up fails its own job and no other.
#
# Re-run for an existing release: Actions -> publish -> Run workflow.

name: publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.1.0)"
        required: true

permissions:
  contents: read

env:
  TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}

jobs:
  assets:
    name: fetch and verify the release assets
    outputs:
      prerelease: ${{ steps.release.outputs.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - name: Read the release type
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
      - name: Download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir assets && cd assets
          gh release download "$TAG" -R "$GITHUB_REPOSITORY"
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: assets
          path: assets/
          retention-days: 7

  pypi:
    needs: assets
    if: needs.assets.outputs.prerelease == 'false' || contains(github.event.release.tag_name || inputs.tag, '-linux-windows.')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: assets
          path: assets
      - name: Select wheels that PyPI has yet to receive
        id: wheels
        shell: python
        run: |
          import hashlib
          import json
          import os
          import shutil
          from pathlib import Path
          from urllib.request import urlopen

          wheels = sorted(Path("assets").glob("*.whl"))
          if not wheels:
              raise SystemExit("No wheels attached to this release")
          with urlopen("https://pypi.org/pypi/thunderstrike/json", timeout=30) as response:
              releases = json.load(response)["releases"]
          dest = Path("dist")
          dest.mkdir()
          for wheel in wheels:
              version = wheel.name.split("-")[1]
              existing = {f["filename"]: f["digests"]["sha256"] for f in releases.get(version, [])}
              if wheel.name not in existing:
                  shutil.copyfile(wheel, dest / wheel.name)
              elif hashlib.sha256(wheel.read_bytes()).hexdigest() != existing[wheel.name]:
                  raise SystemExit(f"{wheel.name} differs from the published wheel")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"pending={str(any(dest.iterdir())).lower()}", file=output)
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: steps.wheels.outputs.pending == 'true'
        with:
          packages-dir: dist/

  npm:
    needs: assets
    if: needs.assets.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: assets
          path: assets
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      # Platform packages first: the main package names them as
      # optionalDependencies, and an install that resolves the main one
      # before they exist gets no native addon.
      - name: Publish
        run: |
          npm install -g npm@latest
          for t in assets/shortsqueeze-thunderstrike-*-*.tgz; do
            npm publish "./$t" --access public --provenance
          done
          npm publish ./assets/shortsqueeze-thunderstrike-[0-9]*.tgz --access public --provenance

  crates:
    needs: assets
    if: needs.assets.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    environment: crates
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      # The crate's build script downloads this release's bundle and checks
      # it against checksums.txt, so `cargo publish`'s verify build is a
      # real end-to-end check of the published crate.
      - name: Publish
        working-directory: rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish

  nuget:
    needs: assets
    if: needs.assets.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: assets
          path: assets
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish
        run: |
          dotnet nuget push assets/*.nupkg \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json
